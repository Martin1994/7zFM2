<!doctype html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Icons Preview</title>
  <style>
    body { margin: 24px; color: #222; background: #eee; font: 14px system-ui, sans-serif; }
    section { display: flex; align-items: end; gap: 24px; margin: 24px 0 40px; overflow-x: auto; padding-bottom: 8px; }
    h2 { font-size: 16px; margin: 0; }
    figure { flex: none; margin: 0; text-align: center; }
    img { display: block; }
    figcaption { margin-top: 8px; color: #555; font-size: 12px; }
  </style>
</head>
<body>
  <h2>Icon 1</h2>
  <section aria-label="Icon 1">
    <figure><img src="icon1.svg" width="16" height="16" alt="icon1 16px"><figcaption>16</figcaption></figure>
    <figure><img src="icon1.svg" width="24" height="24" alt="icon1 24px"><figcaption>24</figcaption></figure>
    <figure><img src="icon1.svg" width="32" height="32" alt="icon1 32px"><figcaption>32</figcaption></figure>
    <figure><img src="icon1.svg" width="48" height="48" alt="icon1 48px"><figcaption>48</figcaption></figure>
    <figure><img src="icon1.svg" width="64" height="64" alt="icon1 64px"><figcaption>64</figcaption></figure>
    <figure><img src="icon1.svg" width="128" height="128" alt="icon1 128px"><figcaption>128</figcaption></figure>
    <figure><img src="icon1.svg" width="256" height="256" alt="icon1 256px"><figcaption>256</figcaption></figure>
  </section>
  <h2>Icon 2</h2>
  <section aria-label="Icon 2">
    <figure><img src="icon2.svg" width="16" height="16" alt="icon2 16px"><figcaption>16</figcaption></figure>
    <figure><img src="icon2.svg" width="24" height="24" alt="icon2 24px"><figcaption>24</figcaption></figure>
    <figure><img src="icon2.svg" width="32" height="32" alt="icon2 32px"><figcaption>32</figcaption></figure>
    <figure><img src="icon2.svg" width="48" height="48" alt="icon2 48px"><figcaption>48</figcaption></figure>
    <figure><img src="icon2.svg" width="64" height="64" alt="icon2 64px"><figcaption>64</figcaption></figure>
    <figure><img src="icon2.svg" width="128" height="128" alt="icon2 128px"><figcaption>128</figcaption></figure>
    <figure><img src="icon2.svg" width="256" height="256" alt="icon2 256px"><figcaption>256</figcaption></figure>
  </section>
</body>
</html>
